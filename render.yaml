# Render Blueprint: one web service (API + website) and one Postgres database.
# Deploy with Render Dashboard → New → Blueprint → pick this repo.
#
# Currently on FREE plans for testing. Limits to know:
#   - The web service sleeps after ~15 min without visitors; the next visit takes up to a minute.
#     Expiry checks pause while asleep and catch up on wake-up.
#   - The free database expires after a limited time (see Render's docs); don't keep real data on it.
# To go live, change `plan: free` to `plan: starter` (web) and `plan: basic-256mb` (database).
services:
  - type: web
    name: netportal
    runtime: node
    plan: free
    region: frankfurt # closest Render region to Nigeria
    buildCommand: npm run render-build
    startCommand: npm start # runs DB migrations + idempotent seed, then starts the server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: TZ
        value: Africa/Lagos
      - key: DATABASE_URL
        fromDatabase:
          name: netportal-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      # Asked for when the Blueprint is created; used to create the first super admin.
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false

databases:
  - name: netportal-db
    plan: free
    region: frankfurt
    databaseName: netportal
    user: netportal
